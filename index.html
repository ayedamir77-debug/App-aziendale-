async function prepFile(file) {
  if (!file.type.startsWith("image/") || file.type === "image/gif") return file;

}

/* scadenze fiscali indicative */
function fiscalDeadlines(reg, per, today) {
  const out = [], t = new Date(today || new Date()); t.setHours(0, 0, 0, 0);
  const end = new Date(t); end.setDate(end.getDate() + 90);
  const add = (y, m, d, label) => {
    const dt = new Date(y, m, d);
    while (dt.getDay() === 0 || dt.getDay() === 6) dt.setDate(dt.getDate() + 1);
    if (dt >= t && dt <= end) out.push({ date: dt, label });
  };
  const vat = reg !== "forfettario";
  for (let k = 0; k <= 4; k++) {
    const base = new Date(t.getFullYear(), t.getMonth() + k, 1), y = base.getFullYear(), m = base.getMonth();
    const d16 = m === 7 ? 20 : 16;
    add(y, m, d16, "F24: ritenute e contributi dei dipendenti (se hai dipendenti in busta paga)");
    if (vat && per === "mensile") add(y, m, d16, "Liquidazione e versamento IVA del mese precedente");
    if (vat && per !== "mensile") {
      if (m === 4) add(y, m, 16, "Versamento IVA 1° trimestre");
      if (m === 7) add(y, m, 20, "Versamento IVA 2° trimestre");
      if (m === 10) add(y, m, 16, "Versamento IVA 3° trimestre");
      if (m === 2) add(y, m, 16, "Versamento IVA 4° trimestre / saldo annuale");
    }
    if (vat && m === 11) add(y, m, 27, "Acconto IVA annuale");
    if (vat && m === 3) add(y, m, 30, "Dichiarazione IVA annuale");
    if (m === 5) add(y, m, 30, reg === "forfettario" ? "Saldo imposta sostitutiva e 1° acconto (o 30 luglio con +0,40%)" : "Saldo imposte sui redditi e 1° acconto");
    if (m === 10) add(y, m, 30, reg === "forfettario" ? "2° acconto imposta sostitutiva" : "2° acconto imposte sui redditi");
    if (m === 4 || m === 10 || m === 1) add(y, m, 16, "Contributi INPS fissi (se artigiano o commerciante)");
    if (m === 7) add(y, m, 20, "Contributi INPS fissi (se artigiano o commerciante)");
  }
  return out.sort((a, b) => a.date - b.date);
}
function periodRange(per) {

  return [a, b];
}
