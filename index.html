<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B6A86">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>App Azienda</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F7F8;color:#14202B;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;padding:20px 16px 110px;min-height:100vh}
h1{font-size:24px;line-height:30px;margin:10px 0 12px}
h2{font-size:16px;margin:22px 0 10px}
p{margin:0 0 10px;line-height:1.45;color:#4E5A66}
.logo{width:44px;height:44px;border-radius:12px;background:#1B6A86}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;border:1px solid #C9D0D6;border-radius:10px;padding:0 14px;font-size:16px;background:#fff;font-family:inherit;color:#14202B}
input,select{height:48px}
textarea{padding:12px 14px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid #1B6A86;border-color:#1B6A86}
button{height:48px;border-radius:10px;border:0;font-size:15px;font-weight:600;font-family:inherit;padding:0 18px;cursor:pointer}
button:disabled{opacity:.6}
.primary{background:#1B6A86;color:#fff;width:100%;margin-top:16px;height:52px;font-size:16px}
.secondary{background:#fff;color:#1B6A86;border:1px solid #1B6A86}
.ghost{background:none;color:#1B6A86;height:auto;padding:8px 0}
.danger{background:#fff;color:#A32121;border:1px solid #E3B4B4;width:100%;margin-top:12px}
.tabs{display:flex;gap:8px;margin:18px 0 4px}
.tab{flex:1;height:44px;background:#fff;border:1px solid #DDE2E6;color:#14202B}
.tab.on{background:#1B6A86;color:#fff;border-color:#1B6A86}
.card{background:#fff;border:1px solid #DDE2E6;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.tap{cursor:pointer}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;height:44px}
.deny{background:#fff;color:#14202B;border:1px solid #C9D0D6}
.ok{background:#1B6A86;color:#fff}
.note{background:#E3F0F5;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.4;margin-top:14px}
.err{background:#FDECEC;color:#8A1C1C;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px}
.code{font-size:22px;font-weight:700;letter-spacing:1px}
.muted{font-size:14px;color:#4E5A66}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.chips{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;background:#fff;border:1px solid #DDE2E6;border-radius:19px;font-size:14px;font-weight:500;color:#14202B}
.chip.on{background:#1B6A86;border-color:#1B6A86;color:#fff}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;white-space:nowrap}
.b-todo{background:#EEF0F2;color:#3B4651}.b-doing{background:#FFF1D6;color:#7A4B00}.b-done{background:#DDF3E4;color:#14602B}
.when{font-size:14px;font-weight:600;color:#1B6A86}
.title{font-size:17px;font-weight:600;margin:6px 0 2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #DDE2E6;display:flex;justify-content:space-around;padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:none;color:#4E5A66;height:46px;padding:0 6px;font-size:12px;flex:1;border-radius:8px}
.nav button.on{color:#1B6A86;background:#E3F0F5}
.link{display:inline-block;color:#1B6A86;font-weight:600;text-decoration:none;padding:8px 0;margin-right:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.cal .dh{font-size:12px;color:#4E5A66;text-align:center;padding:4px 0}
.cal button{height:46px;padding:0;background:#fff;border:1px solid #DDE2E6;color:#14202B;font-weight:500;position:relative}
.cal button.sel{background:#1B6A86;color:#fff;border-color:#1B6A86}
.cal button.today{border:2px solid #1B6A86}
.cal button i{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:3px;background:#E08A00}
.cal button.sel i{background:#fff}
.sp{display:flex;gap:8px}.sp>*{flex:1}
.big{height:76px;font-size:19px;margin-top:8px}
.out{background:#A32121;color:#fff}
.fab{width:100%}
hr{border:0;border-top:1px solid #EAEDEF;margin:12px 0}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://umnofttnykxbxfrnbwtw.supabase.co";
const SUPABASE_KEY = "sb_publishable_fuMVp_I1eCypQGGZ9zLhVw_nw8GEvMz";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const root = document.getElementById("app");

/* ---------- utilità ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let pending;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") pending = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  if (pending != null) el.value = pending;
  return el;
}
const $ = (id) => document.getElementById(id);
function show(...nodes) { root.replaceChildren(...nodes.flat(Infinity).filter((n) => n != null && n !== false)); }
const D = (s) => new Date(s);
const fDate = (s) => D(s).toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });
const fTime = (s) => D(s).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
const fDT = (s) => (s ? fDate(s) + " " + fTime(s) : "");
const toInput = (s) => { if (!s) return ""; const d = new Date(s); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fromInput = (v) => (v ? new Date(v).toISOString() : null);
const dur = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const money = (n) => Number(n).toLocaleString("it-IT", { style: "currency", currency: "EUR" });
const mapsUrl = (a) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a);
const telUrl = (p) => "tel:" + String(p).replace(/[^\d+]/g, "");
const monthStart = () => { const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); return d; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const STATUS = { todo: "Da fare", doing: "In corso", done: "Completato" };
const KINDS = { foto: "Foto", bolla: "Bolla", fattura: "Fattura", altro: "Altro" };

function translate(msg) {
  const m = String(msg || "");
  if (m.includes("Codice azienda non valido")) return "Codice azienda non valido.";
  if (m.includes("already registered")) return "Questa email è già registrata. Prova ad accedere.";
  if (m.includes("Invalid login")) return "Email o password errate.";
  if (m.includes("Password should")) return "La password deve avere almeno 6 caratteri.";
  if (m.includes("Email not confirmed")) return "Conferma prima l'email (controlla la posta).";
  if (m.includes("row-level security") || m.includes("Operazione non consentita")) return "Operazione non consentita.";
  if (m.includes("permission denied")) return "Permesso negato: manca un passaggio di configurazione.";
  if (m.includes("rate limit")) return "Troppi tentativi, riprova tra poco.";
  return "Errore: " + m;
}
async function attempt(fn) {
  try { await fn(); return true; } catch (e) { alert(translate(e && e.message ? e.message : e)); return false; }
}
const chk = (res) => { if (res.error) throw res.error; return res.data; };

/* ---------- stato e navigazione ---------- */
const S = { p: null, tab: "jobs", sub: null, stack: [], month: new Date(), day: new Date(), jobFilter: "open", docKind: "all", team: [], draft: {} };
const OWNER = () => S.p && S.p.role === "owner";
const nameOf = (id) => (S.team.find((t) => t.id === id) || {}).full_name || "";

function go(sub) { S.stack.push({ tab: S.tab, sub: S.sub }); S.sub = sub; history.pushState({}, ""); render(); window.scrollTo(0, 0); }
function back() { if (S.stack.length) history.back(); else { S.sub = null; render(); } }
function setTab(t) { S.tab = t; S.sub = null; S.stack = []; render(); window.scrollTo(0, 0); }
window.addEventListener("popstate", () => {
  if (!S.p) return;
  const x = S.stack.pop();
  if (x) { S.tab = x.tab; S.sub = x.sub; render(); }
});
const logout = () => sb.auth.signOut();

/* ---------- accesso e registrazione ---------- */
let mode = "login";
const form = { name: "", company: "", email: "", code: "" };
function saveForm() { for (const k of ["name", "company", "email", "code"]) { const el = $("f_" + k); if (el) form[k] = el.value; } }

function authScreen(error, info) {
  const tab = (m, label) => h("button", { class: "tab" + (mode === m ? " on" : ""), onclick: () => { saveForm(); mode = m; authScreen(); } }, label);
  const fields = [];
  if (mode !== "login") fields.push(h("label", { for: "f_name" }, "Nome e cognome"), h("input", { id: "f_name", autocomplete: "name", value: form.name }));
  if (mode === "owner") fields.push(h("label", { for: "f_company" }, "Nome dell'azienda"), h("input", { id: "f_company", value: form.company }));
  fields.push(
    h("label", { for: "f_email" }, "Email"), h("input", { id: "f_email", type: "email", autocomplete: "email", value: form.email }),
    h("label", { for: "f_pass" }, "Password"), h("input", { id: "f_pass", type: "password", autocomplete: mode === "login" ? "current-password" : "new-password" })
  );
  if (mode === "employee") fields.push(h("label", { for: "f_code" }, "Codice azienda"), h("input", { id: "f_code", autocapitalize: "characters", value: form.code }));
  const titles = { login: "Accedi", owner: "Crea la tua azienda", employee: "Unisciti alla tua azienda" };
  const labels = { login: "Accedi", owner: "Crea azienda", employee: "Invia richiesta" };
  show(
    h("div", { class: "logo" }), h("h1", {}, titles[mode]),
    mode === "employee" ? h("p", {}, "Usa il codice che ti ha dato il datore di lavoro.") : null,
    h("div", { class: "tabs" }, tab("login", "Accedi"), tab("employee", "Dipendente"), tab("owner", "Datore")),
    ...fields,
    error ? h("div", { class: "err" }, error) : null,
    info ? h("div", { class: "note" }, info) : null,
    mode === "employee" ? h("div", { class: "note" }, "Il datore di lavoro dovrà approvare la richiesta prima che tu possa entrare.") : null,
    h("button", { class: "primary", onclick: async (e) => {
      e.target.disabled = true; saveForm();
      const email = $("f_email").value.trim(), password = $("f_pass").value;
      try {
        if (mode === "login") { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; return; }
        const data = { full_name: form.name.trim() };
        if (mode === "owner") data.company_name = form.company.trim(); else data.join_code = form.code.trim().toUpperCase();
        if (!data.full_name) throw new Error("Inserisci nome e cognome");
        if (mode === "owner" && !data.company_name) throw new Error("Inserisci il nome dell'azienda");
        if (mode === "employee" && !data.join_code) throw new Error("Inserisci il codice azienda");
        const { data: res, error } = await sb.auth.signUp({ email, password, options: { data, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (!res.session) { mode = "login"; authScreen(null, "Registrazione fatta! Controlla l'email e conferma l'indirizzo, poi accedi."); }
      } catch (err) { authScreen(translate(err.message)); }
    } }, labels[mode])
  );
}

/* ---------- avvio ---------- */
async function boot() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { S.p = null; return authScreen(); }
    const { data, error } = await sb.from("profiles").select("*, companies(name, join_code)").eq("id", session.user.id).maybeSingle();
    if (error) throw error;
    if (!data) { show(h("h1", {}, "Profilo non trovato"), h("p", {}, "Esci e registrati di nuovo."), h("button", { class: "ghost", onclick: logout }, "Esci")); return; }
    S.p = data;
    if (data.role === "employee" && data.status !== "active") return waitScreen(data);
    if (data.role === "owner") await loadTeam();
    render();
  } catch (err) {
    show(h("h1", {}, "Qualcosa non va"), h("div", { class: "err" }, String(err.message || err)), h("button", { class: "ghost", onclick: logout }, "Esci"));
  }
}
function waitScreen(p) {
  if (p.status === "pending") show(h("div", { class: "logo" }), h("h1", {}, "Richiesta inviata"),
    h("p", {}, "Il datore di lavoro di " + (p.companies?.name || "questa azienda") + " deve approvare la tua richiesta. Riapri l'app più tardi."),
    h("button", { class: "secondary primary", onclick: boot }, "Controlla ora"), h("button", { class: "ghost", onclick: logout }, "Esci"));
  else show(h("div", { class: "logo" }), h("h1", {}, "Richiesta rifiutata"),
    h("p", {}, "Il datore di lavoro non ha approvato la richiesta. Contattalo per informazioni."), h("button", { class: "ghost", onclick: logout }, "Esci"));
}
async function loadTeam() {
  const { data, error } = await sb.from("profiles").select("*").eq("company_id", S.p.company_id).neq("id", S.p.id).order("created_at");
  if (error) throw error;
  S.team = data;
}

/* ---------- cornice ---------- */
let renderId = 0;
async function render() {
  if (!S.p) return;
  const my = ++renderId;
  show(h("p", { class: "muted", style: "margin-top:40px;text-align:center" }, "Caricamento…"));
  try {
    const sub = S.sub;
    let nodes;
    if (sub) {
      if (sub.t === "job") nodes = await jobView(sub.id);
      else if (sub.t === "jobForm") nodes = await jobForm(sub.id);
      else if (sub.t === "client") nodes = await clientView(sub.id);
      else if (sub.t === "clientForm") nodes = await clientForm(sub.id);
      else if (sub.t === "docForm") nodes = await docForm(sub.job);
    } else {
      if (S.tab === "jobs") nodes = await jobsView();
      else if (S.tab === "cal") nodes = await calView();
      else if (S.tab === "clients") nodes = await clientsView();
      else if (S.tab === "docs") nodes = await docsView();
      else if (S.tab === "team") nodes = await teamView();
      else if (S.tab === "hours") nodes = await hoursView();
    }
    if (my !== renderId) return;
    show(topbar(!!sub), nodes, sub ? null : navbar());
  } catch (e) {
    if (my !== renderId) return;
    show(topbar(false), h("h1", {}, "Qualcosa non va"), h("div", { class: "err" }, String(e.message || e)),
      h("button", { class: "secondary primary", onclick: render }, "Riprova"));
  }
}
function topbar(isSub) {
  if (isSub) return h("div", { class: "top" }, h("button", { class: "ghost", onclick: back }, "← Indietro"));
  return h("div", { class: "top" },
    h("span", { class: "muted" }, S.p.companies?.name || ""),
    h("span", {}, h("button", { class: "ghost", style: "margin-right:18px", onclick: render }, "Aggiorna"), h("button", { class: "ghost", onclick: logout }, "Esci")));
}
function navbar() {
  const items = OWNER()
    ? [["jobs", "Lavori"], ["cal", "Calendario"], ["clients", "Clienti"], ["docs", "Documenti"], ["team", "Team"]]
    : [["jobs", "Lavori"], ["cal", "Calendario"], ["docs", "Documenti"], ["hours", "Ore"]];
  return h("div", { class: "nav" }, items.map(([k, l]) => h("button", { class: S.tab === k ? "on" : "", onclick: () => setTab(k) }, l)));
}
const badge = (s) => h("span", { class: "badge b-" + s }, STATUS[s]);

/* ---------- lavori ---------- */
function jobCard(j) {
  const names = OWNER() ? (j.job_assignments || []).map((a) => nameOf(a.user_id)).filter(Boolean).join(", ") : "";
  return h("div", { class: "card tap", role: "button", tabindex: "0", onclick: () => go({ t: "job", id: j.id }) },
    h("div", { class: "row" }, h("span", { class: "when" }, j.start_at ? fDate(j.start_at) + " · " + fTime(j.start_at) + (j.end_at ? "–" + fTime(j.end_at) : "") : "Senza data"), badge(j.status)),
    h("div", { class: "title" }, j.title),
    j.clients?.name ? h("div", { class: "muted" }, j.clients.name) : null,
    j.address ? h("div", { class: "muted" }, j.address) : null,
    names ? h("div", { class: "muted", style: "margin-top:4px" }, "👷 " + names) : null);
}
async function jobsView() {
  const data = chk(await sb.from("jobs").select("*, clients(name,phone,address), job_assignments(user_id)").order("start_at", { ascending: true, nullsFirst: false }));
  let list = data;
  if (S.jobFilter === "open") list = list.filter((j) => j.status !== "done");
  else if (S.jobFilter === "done") list = list.filter((j) => j.status === "done").reverse();
  const chip = (k, l) => h("button", { class: "chip" + (S.jobFilter === k ? " on" : ""), onclick: () => { S.jobFilter = k; render(); } }, l);
  return [
    h("h1", {}, OWNER() ? "Lavori" : "I miei lavori"),
    h("div", { class: "chips" }, chip("open", "Aperti"), chip("done", "Completati"), chip("all", "Tutti")),
    OWNER() ? h("button", { class: "primary", style: "margin:0 0 14px", onclick: () => go({ t: "jobForm" }) }, "+ Nuovo lavoro") : null,
    list.length ? list.map(jobCard) : h("p", {}, OWNER() ? "Nessun lavoro. Creane uno con il pulsante qui sopra." : "Nessun lavoro assegnato per ora.")
  ];
}

async function jobView(id) {
  const [j, mats, docs] = await Promise.all([
    sb.from("jobs").select("*, clients(*), job_assignments(user_id)").eq("id", id).single().then(chk),
    sb.from("job_materials").select("*").eq("job_id", id).order("created_at").then(chk),
    sb.from("documents").select("*, profiles(full_name)").eq("job_id", id).order("created_at", { ascending: false }).then(chk)
  ]);
  const names = (j.job_assignments || []).map((a) => nameOf(a.user_id)).filter(Boolean);
  const reloadAfter = (fn) => async () => { if (await attempt(fn)) render(); };
  return [
    h("div", { class: "row" }, h("h1", { style: "margin-right:8px" }, j.title), badge(j.status)),
    j.start_at ? h("p", { class: "when" }, "🕒 " + fDT(j.start_at) + (j.end_at ? " → " + fTime(j.end_at) : "")) : null,
    j.clients ? h("div", { class: "card" },
      h("div", { class: "muted" }, "Cliente"), h("div", { class: "title", style: "margin-top:2px" }, j.clients.name),
      h("div", {}, j.clients.phone ? h("a", { class: "link", href: telUrl(j.clients.phone) }, "📞 Chiama") : null,
        h("a", { class: "link", href: "#", onclick: (e) => { e.preventDefault(); go({ t: "client", id: j.clients.id }); } }, "Scheda"))) : null,
    j.address ? h("div", { class: "card" }, h("div", { class: "muted" }, "Indirizzo"), h("div", { style: "margin:2px 0" }, j.address),
      h("a", { class: "link", href: mapsUrl(j.address), target: "_blank", rel: "noopener" }, "🗺️ Indicazioni")) : null,
    j.description ? h("div", { class: "card" }, h("div", { class: "muted" }, "Descrizione"), h("div", { style: "white-space:pre-wrap;margin-top:2px" }, j.description)) : null,
    OWNER() && names.length ? h("p", {}, "👷 Assegnato a: " + names.join(", ")) : null,

    h("h2", {}, "Avanzamento"),
    h("div", { class: "card" },
      h("label", { for: "st", style: "margin-top:0" }, "Stato"),
      h("select", { id: "st" }, ["todo", "doing", "done"].map((s) => h("option", { value: s, selected: j.status === s }, STATUS[s]))),
      h("label", { for: "fn" }, "Note dal cantiere"),
      h("textarea", { id: "fn", rows: "3", placeholder: "Cosa hai fatto, problemi, cose da ricordare…" }, j.field_notes || ""),
      h("button", { class: "primary", style: "margin-top:12px", onclick: reloadAfter(async () => { chk(await sb.rpc("update_job_progress", { p_job: j.id, p_status: $("st").value, p_notes: $("fn").value })); }) }, "Salva avanzamento")),

    h("h2", {}, "Materiale usato"),
    mats.length ? h("div", { class: "card" }, mats.map((m, i) => h("div", { class: "row", style: i ? "border-top:1px solid #EAEDEF;padding-top:8px;margin-top:8px" : "" },
      h("span", {}, m.description), h("span", { class: "muted" }, [m.quantity != null ? Number(m.quantity) : "", m.unit || ""].join(" ").trim(),
        (OWNER() || m.added_by === S.p.id) ? h("button", { class: "ghost", style: "margin-left:10px", "aria-label": "Elimina", onclick: reloadAfter(async () => { chk(await sb.from("job_materials").delete().eq("id", m.id)); }) }, "✕") : null)))) : h("p", {}, "Nessun materiale registrato."),
    h("div", { class: "card" },
      h("label", { for: "md", style: "margin-top:0" }, "Aggiungi materiale"),

    for (const p of pages) {
      const c = await renderPage(p.bmp, p.rot, filt, 2000);
      const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.78));
      out.push({ bytes: new Uint8Array(await blob.arrayBuffer()), w: c.width, h: c.height });
    }
    return buildPdf(out);
  }
  return [
    h("h1", {}, "Nuovo documento"),
    h("div", { class: "card" }, h("div", { class: "title", style: "margin-top:0" }, "Scansiona"), h("p", { class: "muted" }, "Inquadra il foglio da sopra, con buona luce e riempiendo l'inquadratura. Puoi aggiungere più pagine."), box, camIn, galIn),
    h("label", { for: "dk" }, "Tipo"),
    h("select", { id: "dk" }, Object.entries(KINDS).map(([k, l]) => h("option", { value: k, selected: k === (jobId ? "foto" : "bolla") }, l))),
    h("label", { for: "dt" }, "Titolo (facoltativo)"), h("input", { id: "dt", placeholder: "Es. Fattura fornitore Rossi" }),
    h("label", { for: "dj" }, "Lavoro collegato"),
    h("select", { id: "dj" }, h("option", { value: "" }, "— nessuno —"), jobs.map((j) => h("option", { value: j.id, selected: j.id === jobId }, j.title))),
    h("label", { for: "da" }, "Importo in € (facoltativo)"), h("input", { id: "da", type: "number", inputmode: "decimal", step: "0.01" }),
    h("label", { for: "dd" }, "Data del documento"), h("input", { id: "dd", type: "date", value: new Date().toISOString().slice(0, 10) }),
    h("label", { for: "df" }, "Oppure carica un file già pronto (PDF o foto)"), h("input", { id: "df", type: "file", accept: "image/*,application/pdf", style: "height:auto;padding:12px" }),
    h("p", { class: "muted", style: "margin-top:6px" }, "Se hai scansionato delle pagine, viene caricato il PDF della scansione. Max 10 MB."),
    h("button", { class: "primary", onclick: async (e) => {
      e.target.disabled = true; e.target.textContent = "Caricamento…";
      const ok = await attempt(async () => {
        let f, name;
        if (pages.length) { const blob = await makePdf(); name = "Scansione " + new Date().toLocaleDateString("it-IT").replace(/\//g, "-") + ".pdf"; f = new File([blob], name, { type: "application/pdf" }); }
        else { const f0 = $("df").files[0]; if (!f0) throw new Error("Scansiona una pagina o scegli un file"); name = f0.name; f = await prepFile(f0); }
        if (f.size > 10485760) throw new Error("File troppo grande (max 10 MB): prova con meno pagine o 'Bianco e nero'");
        const ext = ((f.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "") || "bin").slice(0, 5);
        const path = S.p.company_id + "/" + crypto.randomUUID() + "." + ext;
        const up = await sb.storage.from("docs").upload(path, f, { contentType: f.type || "application/octet-stream" });
        if (up.error) throw up.error;
        const amount = $("da").value;
        const ins = await sb.from("documents").insert({ company_id: S.p.company_id, job_id: $("dj").value || null, kind: $("dk").value, title: $("dt").value.trim() || null,
          amount: amount === "" ? null : Number(amount), doc_date: $("dd").value || null, file_path: path, file_name: name, mime: f.type, size: f.size, uploaded_by: S.p.id });
        if (ins.error) { await sb.storage.from("docs").remove([path]); throw ins.error; }
      });
      if (ok) back(); else { e.target.disabled = false; e.target.textContent = "Carica"; }
    } }, "Carica")
  ];
}

/* ---------- ore ---------- */
async function hoursView() {
  const since = monthStart().toISOString();
  const entries = chk(await sb.from("time_entries").select("*, jobs(title)").gte("started_at", since).order("started_at", { ascending: false }));
  const open = entries.find((e) => !e.ended_at);
  const myJobs = chk(await sb.from("jobs").select("id,title").neq("status", "done").order("start_at", { nullsFirst: false }));
  const total = entries.reduce((s, e) => s + ((e.ended_at ? D(e.ended_at) : new Date()) - D(e.started_at)), 0);
  const act = (fn) => async () => { if (await attempt(fn)) render(); };
  return [
    h("h1", {}, "Le mie ore"),
    open ? h("div", { class: "note", style: "margin-top:0" }, "Sei dentro dalle " + fTime(open.started_at) + " (" + dur(Date.now() - D(open.started_at)) + ")" + (open.jobs?.title ? " · " + open.jobs.title : "")) : null,
    open
      ? h("button", { class: "primary big out", onclick: act(async () => { chk(await sb.rpc("clock_out")); }) }, "Timbra uscita")
      : [h("label", { for: "hj" }, "Lavoro (facoltativo)"), h("select", { id: "hj" }, h("option", { value: "" }, "— nessuno —"), myJobs.map((j) => h("option", { value: j.id }, j.title))),
        h("button", { class: "primary big", onclick: act(async () => { chk(await sb.rpc("clock_in", { p_job: $("hj").value || null })); }) }, "Timbra entrata")],
    h("h2", {}, "Questo mese: " + dur(total)),
    entries.length ? h("div", { class: "card" }, entries.map((e, i) => h("div", { class: "row", style: i ? "border-top:1px solid #EAEDEF;padding-top:8px;margin-top:8px" : "" },
      h("div", {}, h("div", {}, fDate(e.started_at)), h("div", { class: "muted" }, fTime(e.started_at) + " → " + (e.ended_at ? fTime(e.ended_at) : "in corso") + (e.jobs?.title ? " · " + e.jobs.title : ""))),
      h("strong", {}, dur((e.ended_at ? D(e.ended_at) : new Date()) - D(e.started_at)))))) : h("p", {}, "Nessuna timbratura questo mese.")
  ];
}

/* ---------- team (datore) ---------- */
async function teamView() {
  await loadTeam();
  const entries = chk(await sb.from("time_entries").select("user_id,started_at,ended_at").gte("started_at", monthStart().toISOString()));
  const hours = {};
  for (const e of entries) hours[e.user_id] = (hours[e.user_id] || 0) + ((e.ended_at ? D(e.ended_at) : new Date()) - D(e.started_at));
  const pending = S.team.filter((t) => t.status === "pending"), active = S.team.filter((t) => t.status === "active");
  const decide = async (id, status) => { if (await attempt(async () => { chk(await sb.rpc("set_member_status", { p_user: id, p_status: status })); })) render(); };
  return [
    h("h1", {}, "Il tuo team"),
    h("div", { class: "card row" }, h("div", {}, h("div", { class: "muted" }, "Codice azienda da condividere"), h("div", { class: "code" }, S.p.companies?.join_code)),
      h("button", { class: "secondary", onclick: async (e) => { try { await navigator.clipboard.writeText(S.p.companies.join_code); e.target.textContent = "Copiato"; } catch { alert(S.p.companies.join_code); } } }, "Copia")),
    h("h2", {}, "Richieste in attesa (" + pending.length + ")"),
    pending.length ? pending.map((t) => h("div", { class: "card" }, h("div", {}, h("strong", {}, t.full_name), h("div", { class: "muted" }, t.email)),
      h("div", { class: "btns" }, h("button", { class: "deny", onclick: () => decide(t.id, "rejected") }, "Rifiuta"), h("button", { class: "ok", onclick: () => decide(t.id, "active") }, "Accetta")))) : h("p", {}, "Nessuna richiesta."),
    h("h2", {}, "Dipendenti attivi (" + active.length + ")"),
    active.length ? active.map((t) => h("div", { class: "card" }, h("div", { class: "row" }, h("div", {}, h("strong", {}, t.full_name), h("div", { class: "muted" }, t.email)),
      h("div", { style: "text-align:right" }, h("div", { class: "muted" }, "Ore del mese"), h("strong", {}, dur(hours[t.id] || 0)))),
      h("button", { class: "ghost", style: "margin-top:6px;color:#A32121", onclick: () => { if (confirm("Rimuovere " + t.full_name + " dall'azienda?")) decide(t.id, "rejected"); } }, "Rimuovi"))) : h("p", {}, "Ancora nessun dipendente.")
  ];
}

/* ---------- avvio ---------- */
sb.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") { S.p = null; S.tab = "jobs"; S.sub = null; S.stack = []; authScreen(); }
  else if (event === "SIGNED_IN" && (!S.p || (session && session.user.id !== S.p.id))) boot();
});
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch { /* non essenziale */ } }
boot();
</script>
